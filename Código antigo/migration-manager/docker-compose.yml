version: "3.9"

services:
  migration-manager:
    build: .
    ports:
      - "8000:8000"
    environment:
      - AWS_ENDPOINT_URL=http://floci:4566
    depends_on:
      - floci

  # Emulador local de servicos AWS usado durante o desenvolvimento.
  # Substitua pela imagem real do Floci utilizada no seu ambiente.
  floci:
    image: localstack/localstack:latest
    ports:
      - "4566:4566"
    environment:
      - SERVICES=ecs,rds,elbv2
