services:
  floci:
    image: floci/floci:latest
    container_name: floci-aws

    ports:
      - "4566:4566"
      - "7001-7099:7001-7099"

    volumes:
      - ./floci-data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock

    environment:
      FLOCI_HOSTNAME: floci
      FLOCI_BASE_URL: http://floci:4566
      FLOCI_DEFAULT_REGION: us-east-1
      FLOCI_DEFAULT_ACCOUNT_ID: "000000000000"

      # Mantém o estado do plano de controle entre reinicializações. Os
      # volumes dos bancos RDS são administrados pelo próprio Floci.
      FLOCI_STORAGE_MODE: hybrid
      FLOCI_STORAGE_PERSISTENT_PATH: /app/data

      # Todos os containers criados pelo Floci (ECS/RDS) usam
      # a mesma rede Docker do emulador.
      FLOCI_SERVICES_DOCKER_NETWORK: microservices-demo

      # Queremos recursos reais, não apenas metadata.
      FLOCI_SERVICES_ECS_ENABLED: "true"
      FLOCI_SERVICES_ECS_MOCK: "false"
      FLOCI_SERVICES_ECS_DOCKER_NETWORK: microservices-demo

      FLOCI_SERVICES_RDS_ENABLED: "true"
      FLOCI_SERVICES_RDS_MOCK: "false"
      FLOCI_SERVICES_RDS_DOCKER_NETWORK: microservices-demo
      FLOCI_SERVICES_RDS_PROXY_BASE_PORT: "7001"
      FLOCI_SERVICES_RDS_PROXY_MAX_PORT: "7099"

    networks:
      - microservices-demo

networks:
  microservices-demo:
    name: microservices-demo
